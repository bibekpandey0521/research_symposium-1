      <stop offset="0" stop-color="#F8FAFF"/>
      <stop offset="0.5" stop-color="#EDF3FC"/>
      <stop offset="1" stop-color="#FBF6ED"/>
    </linearGradient>
    <radialGradient id="blueGlow" cx="0.12" cy="0.1" r="0.65">
      <stop offset="0" stop-color="#0033A0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#0033A0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blueGlow2" cx="0.92" cy="0.2" r="0.5">
